name: The Last Broadcast - build

on:
  push:
    paths:
      - 'TheLastBroadcast/**'
      - '.github/workflows/the-last-broadcast.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TheLastBroadcast
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build mod (Forge 1.21.1)
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon build

      - name: Verify jar contents
        run: |
          JAR=build/libs/TheLastBroadcast-1.0.0-forge-1.21.1.jar
          test -f "$JAR"
          unzip -l "$JAR" | grep -q 'META-INF/mods.toml'
          unzip -l "$JAR" | grep -q 'assets/lastbroadcast/content/index.json'
          unzip -l "$JAR" | grep -q 'com/lastbroadcast/LastBroadcast.class'

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: TheLastBroadcast-1.0.0-forge-1.21.1
          path: TheLastBroadcast/build/libs/TheLastBroadcast-1.0.0-forge-1.21.1.jar
          if-no-files-found: error
